<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b1e23">
<meta name="color-scheme" content="light">
<title>网络排障助手</title>
<style>
  /* ============================================================
     网络排障助手 · 现场技术手册
     设计基调：纸感底 + 墨黑字 + 发丝细线 + 一处工程黄
     布局：≥1024px 桌面三栏（导航轨 / 正文 / 侧注）· <1024px 手机单栏
     ============================================================ */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --paper:#f2f1ec; --surface:#ffffff; --surface-2:#faf9f5;
    --ink:#17191c; --ink-2:#4a4f57; --ink-3:#868c95;
    --rule:#d9d6cd; --rule-2:#e9e6de;
    --graphite:#1b1e23; --graphite-2:#262a31; --graphite-3:#33383f;
    --safety:#f0b429; --safety-2:#fdf4dc; --safety-ink:#8a5f00;
    --danger:#a5342b; --danger-2:#fbf0ee;
    --ok:#2c6b4c;
    --mono:"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono","Courier New",ui-monospace,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --r:4px; --pad:clamp(16px,3vw,44px);
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
  body{font-family:var(--sans);font-size:15px;line-height:1.7;color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
  ::selection{background:#f7e0a4;color:var(--ink)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  a{color:inherit}
  .num{font-family:var(--mono);letter-spacing:.01em}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .ic.s{width:14px;height:14px}
  .ic.xs{width:12px;height:12px;stroke-width:1.8}

  /* ---------- 骨架 ---------- */
  #app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
  .main{min-width:0;display:flex;flex-direction:column;
    background-color:var(--paper);
    background-image:radial-gradient(rgba(23,25,28,.05) .5px,transparent .6px);background-size:7px 7px}
  .wrap{width:100%;max-width:960px;margin:0 auto;padding:0 var(--pad) 40px}

  /* ---------- 顶部（手机） ---------- */
  .topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;height:52px;
    padding:0 14px;background:var(--graphite);color:#eceae5;box-shadow:0 1px 0 rgba(255,255,255,.06)}
  .topbar .mk{width:24px;height:24px;flex:0 0 auto;color:#e4e1da}
  .topbar .tt{font-size:15px;font-weight:600;letter-spacing:.03em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
  .topbar .sp{flex:1}
  .tbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;border-radius:3px;
    background:none;color:#c8ccd2;cursor:pointer}
  .tbtn:active{background:rgba(255,255,255,.1);color:#fff}
  @media(min-width:1024px){.topbar{display:none}}

  /* ---------- 左侧导航轨（桌面） ---------- */
  .rail{display:none}
  @media(min-width:1024px){
    .rail{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
      background:var(--graphite);color:#c4c9d1;padding:22px 14px 18px;overscroll-behavior:contain}
    #app{grid-template-columns:246px minmax(0,1fr)}
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;border-bottom:1px solid var(--graphite-3)}
  .brand .mk{width:30px;height:30px;flex:0 0 auto;color:#f0b429}
  .brand .bt{min-width:0;display:flex;flex-direction:column;gap:3px}
  .brand .bn{display:block;font-size:15px;font-weight:600;color:#f1efe9;letter-spacing:.03em;line-height:1.25}
  .brand .bv{display:block;font-family:var(--mono);font-size:9.5px;color:#7c828b;letter-spacing:.1em;line-height:1.2}
  .rl-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#6c727b;margin:20px 8px 8px}
  .nav-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;margin-bottom:1px;
    border:1px solid transparent;border-radius:3px;background:none;color:#b6bbc4;font-size:14px;
    font-family:var(--sans);cursor:pointer;transition:background .12s,color .12s}
  .nav-i:hover{background:var(--graphite-2);color:#e9e9ea}
  .nav-i.on{background:var(--paper);color:var(--ink);font-weight:600}
  .nav-i .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#767c85}
  .nav-i.on .n{color:#8b9098;font-weight:400}
  .nav-i .ic{width:17px;height:17px;opacity:.92}
  .nav-i.on .ic{color:var(--safety-ink)}
  .rail .sp{flex:1;min-height:16px}
  .rail-ft{border-top:1px solid var(--graphite-3);padding-top:12px;margin-top:16px}
  .offline{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:#7f858e;padding:9px;letter-spacing:.03em}
  .offline i{width:6px;height:6px;border-radius:50%;background:#3f9e6d;flex:0 0 auto}

  /* ---------- 正文 ---------- */
  .mast{padding:30px 0 0}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.17em;color:var(--ink-3);text-transform:uppercase}
  .eyebrow .ln{flex:1;height:1px;background:var(--rule)}
  .mast h1{font-size:clamp(27px,2.7vw,35px);line-height:1.2;font-weight:700;letter-spacing:-.01em;margin:13px 0 0}
  .mast .sub{margin-top:9px;font-size:14.5px;color:var(--ink-2);max-width:52em}
  .mstat{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .mstat span{padding:7px 0;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
  .mstat span+span{padding-left:16px;margin-left:16px;border-left:1px solid var(--rule-2)}
  .mstat b{color:var(--ink);font-weight:600}

  .swrap{position:sticky;top:52px;z-index:40;margin:20px calc(-1 * var(--pad)) 0;padding:12px var(--pad);
    background:var(--paper);border-bottom:1px solid var(--rule-2)}
  @media(min-width:1024px){.swrap{position:static;margin:22px 0 0;padding:0;background:none;border-bottom:0}}
  .sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rule);
    border-radius:var(--r);padding:0 12px;height:48px;transition:border-color .14s,box-shadow .14s}
  .sbox:hover{border-color:#c3bfb4}
  .sbox:focus-within{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--safety)}
  .sbox .ic{color:var(--ink-3)}
  .sbox input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);
    font-family:var(--sans);font-size:16px;height:100%}
  .sbox input::placeholder{color:#a5aab1}
  .sbox .clr{display:none;width:26px;height:26px;border:1px solid var(--rule);border-radius:3px;background:var(--surface-2);
    color:var(--ink-3);cursor:pointer;font-size:13px;line-height:1;padding:0}
  .sbox.has .clr{display:block}
  .kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--rule);
    border-bottom-width:2px;border-radius:3px;padding:1px 6px;background:var(--surface-2)}
  @media(max-width:1023px){.kbd{display:none}}

  .filters{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .frow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    padding-bottom:2px;margin:0 calc(-1 * var(--pad));padding-left:var(--pad);padding-right:var(--pad)}
  @media(min-width:1024px){.frow{flex-wrap:wrap;overflow:visible;margin:0;padding:0}}
  .frow::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);background:var(--surface);
    border:1px solid var(--rule);border-radius:3px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .fchip:hover{border-color:var(--ink-3);color:var(--ink)}
  .fchip:active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .cseg{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;font-family:var(--sans);font-size:13.5px;
    color:var(--ink-2);background:none;border:1px solid transparent;border-radius:3px;padding:6px 11px;
    cursor:pointer;white-space:nowrap}
  .cseg .ic{width:16px;height:16px;opacity:.8}
  .cseg .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .cseg:hover{background:rgba(23,25,28,.05)}
  .cseg.on{background:var(--ink);border-color:var(--ink);color:#f5f4ef;font-weight:600}
  .cseg.on .n{color:#a6abb3}
  .cseg.on .ic{opacity:1;color:var(--safety)}

  .rc{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
  .rc .l{font-family:var(--mono);font-size:10px;letter-spacing:.16em}
  .rc a{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;
    border-bottom:1px solid var(--rule);padding-bottom:1px}
  .rc a:hover{color:var(--ink);border-color:var(--ink-3)}
  .rc a i{width:4px;height:4px;border-radius:50%;background:var(--safety)}
  @media(min-width:1024px){.rc{display:none}}

  /* ---------- 分组 ---------- */
  .grp{margin-top:26px}
  .grp-h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .grp-h .ic{width:18px;height:18px;color:var(--ink-2)}
  .grp-h h2{font-size:15px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
  .grp-h .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
  .grp-h .ln{flex:1;height:1px;background:var(--rule)}
  .cards{display:grid;gap:9px;grid-template-columns:1fr}
  @media(min-width:1080px){.cards{grid-template-columns:1fr 1fr}}
  .card{display:flex;gap:13px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);
    border-radius:var(--r);text-decoration:none;transition:border-color .12s,background .12s}
  .card:hover{border-color:#b9b4a8}
  .card.cur{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--safety)}
  .card .no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding-top:4px;min-width:20px;letter-spacing:.04em}
  .card .bd{flex:1;min-width:0}
  .card h3{font-size:15.8px;font-weight:650;line-height:1.45;letter-spacing:.005em}
  .card p{margin-top:5px;font-size:13.5px;line-height:1.62;color:var(--ink-2);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tag{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--rule-2);
    border-radius:2px;padding:1px 7px}
  .tag .num{font-size:11px;color:var(--ink)}
  .card .arw{width:16px;height:16px;align-self:center;color:var(--ink-3);opacity:0;transform:translateX(-4px);transition:.14s}
  @media(hover:hover){.card:hover .arw{opacity:1;transform:none}}
  .favbtn{display:grid;place-items:center;width:30px;height:30px;flex:0 0 auto;align-self:center;
    border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink-3);cursor:pointer}
  .favbtn:hover{border-color:var(--ink-3);color:var(--ink)}
  .favbtn.on{color:var(--safety-ink);border-color:#e0c887;background:var(--safety-2)}
  .favbtn.on .ic{fill:currentColor}
  .favbtn .ic{width:15px;height:15px}

  .s-title-row{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
  .s-title-row .s-title{margin-top:0;flex:1;min-width:0}
  .s-title-row .favbtn{width:36px;height:36px;margin-top:2px}

  .cmd{display:flex;gap:10px;align-items:center;padding:9px 0;cursor:pointer}
  .cmd+.cmd{border-top:1px solid var(--rule-2)}
  .cmd .t{flex:1;min-width:0;font-size:13.6px;color:#20242b}
  .cmd code{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--rule);border-radius:2px;padding:2px 7px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:44%}
  .cmd .cp{color:var(--ink-3);flex:0 0 auto;display:grid;place-items:center}
  .cmd .cp .ic{width:14px;height:14px}
  .cmd:hover code{border-color:var(--ink-3)}

  .tels{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .tels .btn{flex:0 0 auto;text-decoration:none}
  .tels .btn .num{font-family:var(--mono);font-weight:600}

  .empty{margin:40px 0;padding:30px 20px;border:1px dashed var(--rule);border-radius:var(--r);text-align:center}
  .empty .big{color:var(--ink-3);margin-bottom:12px}
  .empty p{font-size:14px;color:var(--ink-2)}
  .empty .btn{margin-top:16px}

  /* ---------- 场景页 ---------- */
  .scene{padding-top:24px}
  @media(min-width:1024px){.scene{padding-top:34px}}
  .crumbs{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.14em;color:var(--ink-3)}
  .crumbs a{text-decoration:none;color:var(--ink-3);border-bottom:1px solid transparent;cursor:pointer}
  .crumbs a:hover{color:var(--ink);border-color:var(--rule)}
  .crumbs .sep{opacity:.5}
  .s-title{font-size:clamp(24px,2.5vw,32px);line-height:1.28;font-weight:700;letter-spacing:-.008em;margin:12px 0 0;max-width:22em}
  .s-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-3)}
  .s-meta .d{width:3px;height:3px;border-radius:50%;background:var(--rule)}
  .s-meta .b{display:inline-flex;align-items:center;gap:6px}
  .s-print{display:none}

  .leaf{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
    margin-top:11px;overflow:hidden}
  .leaf-h{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--rule-2);
    background:var(--surface)}
  .leaf-no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--rule);
    border-radius:2px;padding:0 5px;line-height:1.65;letter-spacing:.04em}
  .leaf-h h2{font-size:13.5px;font-weight:650;letter-spacing:.03em;white-space:nowrap}
  .leaf-h .ic{width:15px;height:15px;color:var(--ink-3)}
  .leaf-h .ln{flex:1;height:1px;background:var(--rule-2);min-width:12px}
  .leaf-b{padding:14px 15px 15px}
  .leaf-b.tight{padding:0}
  .para{font-size:15px;line-height:1.78;color:#20242b}
  .leaf--quick{background:var(--safety-2);border-color:#ecd9a4}
  .leaf--quick::before,.leaf--warn::before,.leaf--quote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
  .leaf--quick::before{background:var(--safety)}
  .leaf--quick .leaf-h{background:transparent;border-color:#ecdfba}
  .leaf--quick .leaf-no{color:var(--safety-ink);border-color:#e0c887;background:rgba(255,255,255,.6)}
  .leaf--quick .leaf-h .ic{color:var(--safety-ink)}
  .leaf--quick .para{color:#3a2f10}
  .leaf--warn{background:var(--danger-2);border-color:#e9cdc8}
  .leaf--warn::before{background:var(--danger)}
  .leaf--warn .leaf-h{background:transparent;border-color:#edd9d5}
  .leaf--warn .leaf-no,.leaf--warn .leaf-h .ic{color:var(--danger);border-color:#e2bbb4}
  .leaf--warn .leaf-h .ic{border:0}
  .leaf--warn .para{color:#4a201b}
  .leaf--quote{background:var(--surface-2);border-color:var(--rule)}
  .leaf--quote::before{background:var(--graphite)}
  .leaf--quote .leaf-h{background:transparent;border-color:var(--rule-2)}
  .leaf--quote .para{font-size:15.5px;line-height:1.82;color:#25292f;padding-left:16px;position:relative}
  .leaf--quote .para::before{content:"\201C";position:absolute;left:0;top:2px;font-size:26px;line-height:1;color:var(--safety);font-weight:700}

  .cz{display:flex;gap:11px;align-items:flex-start;padding:11px 0 11px 12px;border-left:2px solid var(--pc,var(--rule))}
  .cz+.cz{border-top:1px solid var(--rule-2)}
  .cz .no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding-top:3px}
  .cz .t{flex:1;font-size:14.6px;line-height:1.66;color:#20242b}
  .cz .p{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;
    color:var(--pc);border:1px solid var(--pc);border-radius:2px;padding:0 6px;line-height:1.7;margin-top:2px}
  .cz.hi{--pc:var(--danger)} .cz.mid{--pc:var(--safety-ink)} .cz.lo{--pc:var(--ink-3)}

  .lprog{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .lprog b{color:var(--ink);font-weight:600}
  .pbar{width:78px;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:var(--safety);transition:width .22s}
  @media(max-width:400px){.pbar{width:52px}}

  .step{display:flex;gap:12px;padding:12px 15px;cursor:pointer;align-items:flex-start;
    border-top:1px solid var(--rule-2);scroll-margin-top:120px;transition:background .1s}
  .step:first-child{border-top:0}
  @media(min-width:1024px){.step{scroll-margin-top:24px}}
  .step:hover{background:var(--surface-2)}
  .cbx{flex:0 0 auto;width:18px;height:18px;margin-top:2px;border:1.5px solid #a8a49a;border-radius:2px;
    background:var(--surface);display:grid;place-items:center;transition:.12s}
  .cbx .ic{width:11px;height:11px;stroke:#fff;stroke-width:2.4;opacity:0;transition:opacity .12s}
  .step.done .cbx{background:var(--ok);border-color:var(--ok)}
  .step.done .cbx .ic{opacity:1}
  .step .n{flex:0 0 auto;width:18px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding-top:4px}
  .step .x{flex:1;font-size:14.8px;line-height:1.7;color:#20242b}
  .step.done .x{color:var(--ink-3)}
  .step.done .n{color:var(--ok)}

  .acts{display:flex;gap:8px;flex-wrap:wrap;padding:13px 15px;border-top:1px solid var(--rule-2);background:var(--surface-2)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--sans);font-size:13.5px;
    font-weight:600;padding:9px 16px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);
    color:#f6f5f0;cursor:pointer;transition:background .12s,border-color .12s}
  .btn:hover{background:#000;border-color:#000}
  .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--ink-3)}
  .btn.bare{background:none;border-color:transparent;color:var(--ink-3);font-weight:500;padding:9px 6px}
  .btn.bare:hover{color:var(--ink);background:rgba(23,25,28,.05)}
  .btn .ic{width:15px;height:15px}

  .tlist{list-style:none}
  .tlist li{position:relative;padding:7px 0 7px 18px;font-size:14.4px;line-height:1.7;color:#20242b}
  .tlist li+li{border-top:1px solid var(--rule-2)}
  .tlist li::before{content:"";position:absolute;left:2px;top:15px;width:5px;height:5px;background:var(--safety)}

  .aiblk textarea{width:100%;border:1px solid var(--rule);border-radius:3px;font-family:var(--sans);font-size:15px;
    line-height:1.6;padding:10px 11px;resize:none;min-height:72px;max-height:180px;outline:0;color:var(--ink);
    background:var(--surface);display:block}
  .aiblk textarea:focus{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--safety)}
  .aiblk textarea::placeholder{color:#a5aab1}
  .aiblk textarea:disabled{background:var(--surface-2);color:var(--ink-3)}
  /* 对话记录 */
  .aichat{display:flex;flex-direction:column;gap:7px}

<script>
var KB = {"meta":{"title":"网络排障助手","subtitle":"网络 · 监控 · 弱电 · 办公设备","version":"1.0","date":"2026-10","author":"设备运维项目组","note":"内容整理自实训资料与常见故障处理经验 · 以实际设备为准","categories":[{"id":"net-down","name":"上不了网","icon":"🌐","desc":"全楼/单机断网、DNS、网速慢、WiFi"},{"id":"net-device","name":"网络设备","icon":"🔌","desc":"交换机端口、Ping 不通、VLAN、环路、光猫"},{"id":"cctv","name":"监控弱电","icon":"📹","desc":"摄像头离线、黑屏、NVR、PoE 供电"},{"id":"office","name":"终端办公","icon":"💻","desc":"电脑、打印机、共享、IP 冲突"},{"id":"emergency","name":"应急速查","icon":"🚨","desc":"恢复顺序、巡检、安全边界"}]},"scenes":[{"id":"nd1","cat":"net-down","title":"整个办公室 / 整栋楼都上不了网","keywords":["上不了网","没网","断网","全断了","都上不了","无法上网","宽带","整个办公室","整栋","整层","整个楼","全都上不了网","宽带断了","断网了"],"phenomenon":"客户说「整个办公室都上不了网」，好几台设备同时不行。","quick":"先确认范围：只有一台电脑，还是好几台、整个办公室？只有一台 → 查「单台电脑上不了网」；全部 → 从光猫和主路由开始。再看光猫指示灯，5 秒判断是线路问题还是设备问题。","causes":[{"t":"宽带线路故障：光纤断、欠费、运营商片区故障","p":"高"},{"t":"光猫或主路由断电、死机（被踢掉排插最常见）","p":"中"},{"t":"停电、跳闸，或排插被碰松","p":"中"},{"t":"主交换机故障或上联线松动","p":"低"}],"steps":["看光猫指示灯：电源灯（PWR）亮不亮？光信号 / LOS 灯有没有红灯闪或常亮？红灯 → 光纤线路故障，直接走「光猫指示灯异常」流程","看 PON 灯：常亮 = 注册正常；闪烁 = 正在注册或异常","排除欠费：让客户打运营商客服查一下，或看缴费记录——欠费会整条宽带停机","看主路由 / 主交换机电源灯亮不亮、排插松没松、有没有跳闸","按顺序重启：光猫断电 30 秒 → 上电等 2 分钟 → 主路由 → 主交换机，每级等指示灯稳定","甩开路由器测试：电脑网线直连光猫 LAN 口，能上网 → 问题在路由器；不能上网 → 问题在光猫或线路","光猫正常但全楼不通 → 检查主交换机上联口和各口指示灯，换个上联口试"],"tips":["先数一遍链路：光猫 → 路由 → 交换机 → 终端，再动手。重启不是玄学——设备死机是高频原因。","光猫正常但全楼不通，问题大概率在主交换机或它上面的那根上联线。"],"escalate":"光猫 LOS 红灯 / 欠费 / 运营商片区故障 → 让客户拨打运营商客服报修（电信 10000、移动 10086、联通 10010），帮忙说清现象并记录故障单号。","script":"「我先看一下是线路的问题还是设备的问题，几分钟；如果需要报修运营商，我帮您把故障说清楚。」","tels":[{"t":"电信","n":"10000"},{"t":"移动","n":"10086"},{"t":"联通","n":"10010"}]},{"id":"nd2","cat":"net-down","title":"只有一台电脑上不了网，别人都正常","keywords":["一台电脑","就我这台","别人能上","黄叹号","感叹号","红叉","上不了网","单台电脑","我这台","网络图标","黄三角"],"phenomenon":"同事都能上网，就这一台电脑不行；右下角可能带黄叹号或红叉。","quick":"看右下角网络图标：红叉 = 网线没插好 / 网口没通（物理问题）；黄叹号 = 连上了但没拿到地址（IP 问题）；图标正常 = 多半是 DNS 或浏览器问题。再看这台是有线还是无线。","causes":[{"t":"网线松动、水晶头坏、网口没插实","p":"高"},{"t":"IP 没拿到：显示 169.254 开头地址","p":"高"},{"t":"网卡被禁用或驱动异常","p":"中"},{"t":"这台电脑的 IP 被别的设备占了（冲突）","p":"中"},{"t":"交换机端口故障或被做了限制","p":"低"}],"steps":["看屏幕右下角图标：红叉 / 黄叹号 / 正常，先分类","有线：网线两头重新插紧（听到「咔」），换一根好线再试","无线：确认连的是正确 WiFi；「忘记此网络」后重连；有线无线互相切换测一下","查地址：cmd 输入 ipconfig —— 显示 169.254.x.x = 没拿到地址 → 重启电脑、换个交换机口、确认上级路由 DHCP 开着","地址正常但上不了：ping 网关（如 192.168.1.1）→ 通 = 本机到网关链路 OK，继续下一步；不通 = 换交换机口、换网线","再 ping 114.114.114.114 → 通但网页打不开 = DNS 问题，改成 114.114.114.114 / 223.5.5.5","看网卡是否被禁用：控制面板 → 网络连接 → 灰色「已禁用」的启用一下","检查是不是手动设了固定 IP 且没填对网关、DNS"],"tips":["169.254 开头的地址是 Windows 自己编的临时地址（APIPA），说明它没问到 DHCP 服务器——记住这个数就能秒判「拿不到地址」。","同一位置多台电脑先后出问题 → 别折腾电脑，去查那个交换机口。"],"escalate":"换线换口都无效 → 网卡或电脑硬件问题，建议报修电脑；同一交换机下多台异常 → 上报检查交换机。","script":"「先帮您看出是网线、电脑设置还是网络的问题，不影响其他人上网。」","cmds":[{"t":"查本机地址，看有没有拿到 169.254 开头的地址","c":"ipconfig"},{"t":"测到网关通不通（网关换成实际的）","c":"ping 192.168.1.1"},{"t":"测外网通不通，区分是不是 DNS 问题","c":"ping 114.114.114.114"}]},{"id":"nd3","cat":"net-down","title":"能上微信 / QQ，但打不开网页","keywords":["微信能上","QQ能上","网页打不开","能聊天打不开","DNS","部分网站打不开","浏览器打不开","能上QQ打不开网页","网页加载不出来"],"phenomenon":"微信消息能发、视频能刷，但浏览器打不开网页 / 部分网站打不开。","quick":"这类基本是 DNS 问题——微信走长连接不依赖域名解析，网页必须解析域名。最快验证：同 WiFi 下用手机打开同一网址，手机也打不开 → 网络侧 DNS 问题；只有这台不行 → 这台电脑的问题。","causes":[{"t":"DNS 服务器故障或被改错（上级路由/运营商 DNS 出问题）","p":"高"},{"t":"电脑上设了错误 DNS 或代理没关干净","p":"中"},{"t":"浏览器插件 / 缓存问题","p":"低"}],"steps":["同 WiFi 用手机测同一网址：都打不开 → 改路由器/电脑 DNS；只有这台不行 → 只处理这台","改 DNS：网络适配器 → IPv4 属性 → 首选 114.114.114.114、备用 223.5.5.5 → 再 cmd 运行 ipconfig /flushdns","查代理：设置 → 代理 → 关闭「使用代理服务器」（加速器、某些工具退出后不还原代理，这是高频坑）","换浏览器测：排除插件问题，或用无痕模式","用 ping 域名判断：ping www.baidu.com —— 提示「找不到主机」= 解析问题确认；能解析出 IP 但网页打不开 = 网络侧端口拦截"],"tips":["公共 DNS 记三个：114.114.114.114、223.5.5.5（阿里）、119.29.29.29（腾讯），现场换着试。","「微信能上网页打不开」= DNS；「网页能开微信不能上」= 少见，多半是代理工具作怪。"],"escalate":"全办公室都打不开网页且换 DNS 无效 → 上联网络或运营商问题，报上级 / 运营商。","script":"「这是域名解析的问题，我改一下 DNS 设置就好，两三分钟。」","cmds":[{"t":"清掉本机 DNS 缓存","c":"ipconfig /flushdns"},{"t":"测域名能不能解析出来","c":"ping www.baidu.com"},{"t":"测外网 IP 通不通","c":"ping 114.114.114.114"}]},{"id":"nd4","cat":"net-down","title":"网速慢、卡顿","keywords":["网速慢","卡","卡顿","下载慢","波动","很慢","太慢","下载速度慢","看视频卡","延迟高","网速","上网慢"],"phenomenon":"能上网但很慢：网页转圈、视频卡、下载慢。","quick":"先问「一直慢还是突然慢、是一台慢还是都慢」：一台慢 → 查这台（线/无线位置）；都慢 → 查带宽占用和主设备。再分有线/无线测一次对比。","causes":[{"t":"有人下载 / 看视频 / 网盘同步，占满带宽","p":"高"},{"t":"无线信号差、干扰大（离得远、隔墙多、2.4G 拥挤）","p":"中"},{"t":"路由器长时间没重启、设备老化","p":"中"},{"t":"网线只通了百兆（四芯线 / 水晶头没压好）","p":"低"},{"t":"宽带套餐本身带宽小","p":"低"}],"steps":["区分有线 / 无线：有线也慢 → 查带宽占用和线路；只有无线慢 → 查位置、隔墙、信道","问一圈「谁在下载」：迅雷、网盘、视频、系统更新都会占满带宽，抓到一个就解决一半","测速对比：手机上测速，对照套餐带宽（100M 宽带理论下载约 12.5MB/s）","重启顺序：光猫 → 路由，每级等 1-2 分钟","有线慢：检查网线是否八芯全通——百兆只用 4 芯，只压 4 芯的线千兆跑不满；重压水晶头或换线","无线慢：靠近路由器再测一次对比；切到 5G 频段测；路由器里把信道改成 1 / 6 / 11 中空闲的","设备用了 4-5 年的路由器建议直接更换"],"tips":["千兆网络必须八芯全通 + 超五类以上网线。「能上网但只有百兆」的坑，多半是线的问题。","「一直慢」和「突然慢」是两个排查方向，先问清再动手。"],"escalate":"有线直连光猫测速仍远低于套餐 → 让客户找运营商查线路。","script":"「我先帮您测一下速，看看是宽带本身慢，还是有人在占网速。」"},{"id":"nd5","cat":"net-down","title":"WiFi 连上了但没网 / 信号弱","keywords":["WiFi","无线","连上没网","信号弱","信号差","无线网","加密失败","信号满格上不了网","无线信号弱","连上不能用"],"phenomenon":"手机显示已连接 WiFi 但打不开东西；或某些位置信号只有一格。","quick":"先看别的设备连这个 WiFi 能上网吗：都不能 → 查路由器 / 上级（WiFi 只是「连接上了」，不代表有网）；就这一台不行 → 忘记网络重连；只有某个区域不行 → 覆盖问题，和路由器位置有关。","causes":[{"t":"路由器死机或本身已断网（WiFi 信号在，但出不去）","p":"高"},{"t":"覆盖不足：路由器位置差、隔墙多、面积大","p":"高"},{"t":"信道拥挤（周围 WiFi 太多互相干扰）","p":"中"},{"t":"这台设备的问题：没获取到地址、密码变了没重连","p":"中"},{"t":"无线 AP 故障","p":"低"}],"steps":["拿另一台设备连同一 WiFi 测：判断是「网络问题」还是「这一台的问题」","都不能上网 → 按「整栋上不了网」流程查路由器和上级；顺便重启路由","只有一台连上没网 → 「忘记此网络」重连；查是否拿到 169.254 地址","覆盖问题：路由器别放角落、弱电箱、地上——放居中、高处、少遮挡；大户型加 AP / 子路由","2.4G 和 5G 分开测：5G 快但穿墙差，远距离试用 2.4G","人多干扰重：路由器里把信道改成 1 / 6 / 11 里较空闲的"],"tips":["金属弱电箱是 WiFi 杀手——箱门一关信号掉一半，能引出来就引出来。","「WiFi 能连上」≠「有网」，这两件事分开判断能少走很多弯路。"],"escalate":"大平层 / 多层覆盖不足 → 向客户提交加 AP 的方案；路由器本身故障 → 建议更换。","script":"「我帮您测一下哪个位置信号弱，路由器摆放对 WiFi 影响很大，稍后给您一个建议。」","cmds":[{"t":"查本机地址，看是不是 169.254 开头","c":"ipconfig"}]},{"id":"nd6","cat":"net-down","title":"网络时断时续（一会好一会断）","keywords":["时断时续","一会断一会好","不稳定","掉线","间歇","闪断","老是断","断断续续","老掉线","一直掉线"],"phenomenon":"网络一会儿断一会儿好，重启能用一阵又出问题。","quick":"先固定一台设备持续 ping 网关观察：是一台断还是全体断？一台 → 查这台的网线和水晶头（接触不良最常见）；全体 → 查上级设备、IP 冲突、环路。","causes":[{"t":"水晶头 / 网线接触不良（碰一下就好、晃一下又断）","p":"高"},{"t":"IP 地址冲突：两台设备抢一个地址互相踢","p":"中"},{"t":"网络环路：接线接成圈引起广播风暴","p":"中"},{"t":"设备过热或电源不稳","p":"低"}],"steps":["持续观察：cmd 里 ping 网关 -t，看是否周期性丢包；断的时候是一台还是全体","一台设备频繁断 → 换网线、重做水晶头：重点看水晶头压得松不松、线序乱不乱","全体一起断 → 看交换机指示灯是否全部狂闪 → 疑似环路，走「网络环路」流程","查 IP 冲突：Windows 会弹「检测到 IP 地址冲突」；把冲突的两台改成自动获取或重排地址","摸光猫 / 路由 / 交换机外壳温度：烫手且伴随断网 → 散热差或老化，移位置通风或更换","记录断网时间规律：几点断、断多久——有规律多半和负载 / 温度有关，是找根因的线索"],"tips":["排「时断时续」最忌没重点瞎换：先定范围（一台还是全体），范围一确定，一半的问题就定了。","水晶头做得好不好，手拉一下就知道——一拉就掉、铜丝外露的，直接换。"],"escalate":"全体设备周期性断、重启无用 → 记录现象和时间点，上报并附上观察记录。","script":"「这种一阵一阵的问题得先看规律，我固定几台设备观察一下，有结果马上处理。」","cmds":[{"t":"持续 ping 网关，看丢包有没有规律（按 Ctrl+C 停）","c":"ping 192.168.1.1 -t"}]},{"id":"dv1","cat":"net-device","title":"交换机某个端口指示灯不亮","keywords":["端口不亮","口不亮","灯不亮","交换机","网口没灯","端口","接口不亮","网口坏了","灯不闪","口子不亮"],"phenomenon":"机柜里交换机一个口插了线但灯不亮，接在这口的设备上不了网。","quick":"换一根确定好的网线测同一个口：灯亮 = 线的问题；灯不亮 = 换个空口测：新口亮 = 原端口问题；都不亮 = 对端设备没开机或没供电。","causes":[{"t":"网线 / 水晶头问题：没压好、断芯、劣质线","p":"高"},{"t":"对端设备没开机、网卡坏、PoE 没供电","p":"中"},{"t":"端口被软件禁用或端口故障","p":"中"},{"t":"速率协商失败（少见）","p":"低"}],"steps":["拿一根正在用的好网线插原来这个口 → 灯亮说明原网线有问题，重做 / 更换","原网线插一个空口 → 灯亮说明原端口有问题，避开这个口；管理型交换机可登录检查该口配置","换线换口都不亮 → 问题在对端：确认对端设备开没开机（摄像头 / AP 看电源灯）","对端是摄像头、AP 等 PoE 设备 → 看交换机是不是 PoE 款、这个口有没有供电，走「PoE 不上电」流程","判断线好坏：看两头水晶头压没压紧、线序对不对；用手轻拉，一拉就掉的直接换","坏线重做水晶头：线序 T568B——橙白 橙 绿白 蓝 蓝白 绿 棕白 棕，1、2、3、6 芯是关键"],"tips":["现场判断口诀：先换线、再换口、最后查对端。","水晶头 T568B 线序背下来：橙白、橙、绿白、蓝、蓝白、绿、棕白、棕。"],"escalate":"多个端口同时不亮 / 整机无电 → 检查交换机电源，必要时带备用交换机更换；端口被软件禁用需要管理员账号。","script":"「就这一个口的问题，我换线换口测一下，马上能定位。」"},{"id":"dv2","cat":"net-device","title":"Ping 不通某台设备 / 搜不到设备","keywords":["ping不通","搜不到","找不到设备","连不上","访问不了","扫不到","平不通","ping 不通","搜不到设备","连不上设备"],"phenomenon":"电脑 ping 设备 IP（摄像头 / 服务器 / 打印机）不通，访问不了。","quick":"按「分层」查：① 物理层——设备灯亮不亮、线松没松；② 网络层——电脑和设备是不是同一网段；③ 设备层——设备死没死机、防火墙拦没拦。一层层往下走，别跳步。","causes":[{"t":"物理不通：网线 / 端口问题","p":"高"},{"t":"电脑和目标设备不在同一网段","p":"高"},{"t":"目标设备死机 / 离线","p":"中"},{"t":"目标设备防火墙禁 ping（其实在线）","p":"中"},{"t":"两端在不同 VLAN，被隔离","p":"低"}],"steps":["看物理：设备电源灯、网口灯；线两头插紧；设备断电重启一次","看电脑 IP：ipconfig——和目标前三段数字一样才是同网段（192.168.1.x 和 192.168.1.y 同段）","同网段仍不通 → 电脑网线直连设备绕过交换机：通了 = 交换机或线路问题（换口）；不通 = 设备问题","电脑 IP 改成和设备同网段再试；摄像头用厂商工具扫（海康 SADP、大华 ConfigTool）","能搜到设备但 ping 不通 → 多半是设备防火墙禁 ping，直接用浏览器打开设备 IP 验证是否在线","确认 VLAN：设备接的口和电脑在不在同一个 VLAN / 网段"],"tips":["排「ping 不通」永远从物理层开始：先看灯、再看 IP、最后敲命令。","同网段的判断方法：三个数字一样（前三段），不一样就先改电脑地址再测。"],"escalate":"换线、换口、直连都不通 → 设备本身故障，联系厂商售后或更换。","script":"「我从最基础的查起：先看线和设备状态，再对地址，一步步来。」","cmds":[{"t":"查电脑和目标设备是不是同网段","c":"ipconfig"},{"t":"ping 对方设备（IP 换成实际的）","c":"ping 192.168.1.1"}]},{"id":"dv3","cat":"net-device","title":"跨网段 / 不同 VLAN 之间不通","keywords":["VLAN","跨网段","不同网段","网关","不通","三层","网段隔离","跨段不通"],"phenomenon":"同网段内能通，跨 VLAN / 跨网段访问不了（如办公网访问不到监控网）。","quick":"先分别在两边网段内互 ping 验证各自正常，再查跨网段的「桥」——终端网关填得对不对、三层设备做没做 VLAN 间路由、有没有 ACL 拦截。","causes":[{"t":"终端网关配置不正确","p":"高"},{"t":"三层设备上没做 VLAN 间路由","p":"中"},{"t":"ACL / 防火墙拦截了跨网段访问","p":"中"},{"t":"路由表缺失","p":"低"}],"steps":["A 网段内互 ping、B 网段内互 ping——各自都正常再查跨段","看终端网关：ipconfig 的默认网关是不是本网段的网关地址","检查三层设备（路由器 / 三层交换机）有没有开 VLAN 间路由","检查 ACL / 访问控制策略有没有拦来源或目标网段","用 tracert 追一下：看数据包走到哪一跳断，断点前后就是问题区"],"tips":["跨网段排障答三句话：网关对不对、路由有没有、策略拦没拦。","动核心设备配置前先备份——这是职业习惯，不是胆小。"],"escalate":"涉及核心设备配置修改 → 先备份配置，改动向主管 / 客户确认后再做；不确定不动手。","script":"「两个网段各自都是通的，我在检查中间的转发配置，需要几分钟。」","cmds":[{"t":"查本机默认网关填得对不对","c":"ipconfig"},{"t":"追踪跨网段断在哪一跳（IP 换成实际的）","c":"tracert 192.168.2.1"}]},{"id":"dv4","cat":"net-device","title":"网络环路 / 广播风暴（全网络瘫痪）","keywords":["环路","广播风暴","灯狂闪","全断","越来越卡","连成圈","瘫痪","网络瘫痪","卡死","全公司断网","接成圈"],"phenomenon":"网络突然极慢甚至全瘫，交换机指示灯全部疯狂闪烁。","quick":"看交换机灯：所有口的灯一起高频狂闪 → 基本就是环路。回忆一下刚才谁动过线、加过设备——八成和那个操作有关。","causes":[{"t":"网线两头都插在同一台交换机上（自己连自己）","p":"高"},{"t":"新增设备接线成回路（两台交换机之间接了两根线）","p":"高"},{"t":"墙里面板 / 模块接线错误形成环路","p":"中"}],"steps":["确认现象：所有端口灯同步狂闪、网络几乎不可用 → 立即行动，恢复优先","回忆最近改动：刚插的线、刚加的设备——先拔掉它 → 网络立即恢复 = 找到环了","找不到是哪根 → 逐根拔插：拔一根观察几秒，灯恢复正常就是它（提前和客户说好会短暂断网）","恢复后复盘接线：确认整个拓扑是「树状」而不是「圈」","有条件在管理型交换机上开启 STP（生成树协议）防复发，并能查看端口流量定位异常口","给客户交代：不乱插网线，新增设备先报备"],"tips":["环路是人为事故里最高频的——「刚动完线就出问题」，先怀疑刚动的那根。","处理环路的核心是快：先拔线恢复网络，再慢慢找原因。"],"escalate":"找不到环路来源、网络反复瘫痪 → 上报并启用 STP；把本次处理和原因写进记录。","script":"「网络先恢复：我逐根检查线，中间可能会断一下，很快就好了。」"},{"id":"dv5","cat":"net-device","title":"光猫指示灯异常（LOS 红灯）","keywords":["光猫","LOS","红灯","闪红","光信号","PON","光衰","亮红灯","光信号灯","猫红灯","光纤断了"],"phenomenon":"光猫上红灯闪烁或常亮（标着 LOS 或「光信号」），上不了网。","quick":"看 LOS（光信号）灯：红灯闪 / 常亮 = 光纤链路故障。自己能做的只有两件事：① 检查光纤接头插没插紧 ② 重启光猫；都不行 → 直接报运营商。","causes":[{"t":"光纤线路故障：外力断纤、运营商机房侧问题","p":"高"},{"t":"光猫背面光纤接头松动 / 脏污","p":"中"},{"t":"宽带欠费被停（部分表现为收光正常但上不了网）","p":"中"},{"t":"光猫设备故障","p":"低"}],"steps":["先读懂灯语：PWR = 电源；PON = 注册（常亮正常、闪烁 = 注册中/异常）；LOS / 光信号 = 正常情况下熄灭，红灯闪 / 常亮 = 线路故障","检查光猫背面黄色光纤接头：轻轻拔下看一眼、重新插紧（有轻响）；光纤很脆，禁止用力弯折","重启光猫：断电 30 秒再上电，等 2-3 分钟看 PON 能不能恢复常亮","红灯依旧 → 光纤或运营商侧故障：让客户拨打运营商客服报修，说清「光猫 LOS 红灯，检查接头并重启无效」","问一下客服是不是片区 / 小区故障——是就等恢复，不用折腾设备","修好后测速验证上网，把处理和故障单号记在运维记录上"],"tips":["华为 / 中兴光猫告警灯颜色略有差异（红或橙）——记「有没有告警灯亮」就行。","LOS = Loss of Signal（信号丢失）。光纤严禁自己熔接、严禁大角度折弯。"],"escalate":"LOS 红灯 + 接头插紧 + 重启无效 → 只能报运营商；记下故障单号，客户催就报单号跟进。","script":"「这是光纤线路的故障，光猫收不到光信号。我帮您检查接头，如果不行需要打运营商电话报修——我可以帮您把故障说清楚。」","tels":[{"t":"电信","n":"10000"},{"t":"移动","n":"10086"},{"t":"联通","n":"10010"}]},{"id":"cv1","cat":"cctv","title":"摄像头离线（NVR / 平台显示离线）","keywords":["监控离线","摄像头离线","离线","掉线","连不上摄像头","摄像头不亮","通道离线","看不到监控","监控掉了","监控没反应","摄像头掉线"],"phenomenon":"NVR 或手机上看监控，某个摄像头显示「离线」。","quick":"到摄像头跟前看两个灯：电源灯亮不亮、网口灯闪不闪。不亮 → 查供电（电源 / PoE）；亮但离线 → 查网络（网线 / IP）。一灯一灯排除，别在 NVR 上瞎点。","causes":[{"t":"供电问题：电源适配器坏、PoE 口没电、断电","p":"高"},{"t":"网线水晶头松动 / 氧化（室外尤其常见）","p":"高"},{"t":"IP 冲突或被改（和别人撞地址）","p":"中"},{"t":"NVR / 平台里通道配置丢失、密码被改","p":"中"},{"t":"摄像头本体故障 / 交换机端口坏","p":"低"}],"steps":["到摄像头处看灯：电源灯不亮 → 先查供电（电源头、插排、PoE 口）","电源灯亮、网口灯不闪 → 网线问题：两端重插，水晶头重做（室外头子进水氧化是常态）","灯都正常仍离线 → 电脑用 SADP 扫一下，看能不能搜到、记下 IP","搜到但 NVR 连不上 → 电脑先 ping 摄像头 IP：通 → 查 NVR 通道配置 / 密码；不通 → 查网络链路","电脑也搜不到 → 摄像头直连电脑测试（电脑 IP 改成同网段），还不行 → 长按 Reset 恢复出厂后重新配置（会清空原设置，谨慎用）","恢复后：更新 NVR 通道、对照 IP 清单核对、把线序和端口标记好","排查 IP 冲突：查 IP 规划表，或在交换机上看这个 IP 有没有对应的两个 MAC"],"tips":["室外网线必须做防水（端口朝下 + 防水头）。室外离线九成是水晶头进水。","SADP 是海康官方免费扫描工具，电脑装一个，现场必带；大华对应 ConfigTool。"],"escalate":"直连电脑也不出图 → 摄像头硬件故障，联系供应商保修 / 更换；涉及高空作业（外墙）→ 必须两人配合，不独自登高。","script":"「我先到摄像头那里看看电源和线，大部分离线都是接头或供电的问题，很快能判断。」"},{"id":"cv2","cat":"cctv","title":"监控画面黑屏 / 有电但没图像","keywords":["黑屏","没有画面","不出图","花屏","画面没了","黑屏但有电","没画面","不出画面","监控黑了","画面黑"],"phenomenon":"监控能连上，但画面全黑 / 某个通道黑 / 画面花。","quick":"先看范围：所有通道黑 → 查 NVR 输出线和显示器；只有一个通道黑 → 查这一个摄像头；夜间黑、白天正常 → 查红外 / 供电。","causes":[{"t":"单通道黑：该摄像头问题（走「摄像头离线」流程）","p":"高"},{"t":"全部黑：NVR 到显示器的视频线松、显示器信号源不对","p":"中"},{"t":"夜间黑、白天正常：红外灯故障或供电不足","p":"中"},{"t":"镜头脏 / 被挡 / 镜头盖没摘","p":"低"},{"t":"NVR 死机或通道异常","p":"低"}],"steps":["区分范围：一个通道黑，还是全部黑？","全部黑 → 检查 NVR 的 HDMI / VGA 线两端、显示器信号源切对没有、重启 NVR","单通道黑 → 按「摄像头离线」流程查这个摄像头","白天正常、晚上黑 → 供电不足或红外灯坏：换足功率电源（12V/2A 常见）、检查线路压降","花屏、水波纹、有横纹 → 线材质量 / 接头氧化 / 电源不干净：换线、换电源，走线避开强电","擦干净镜头外壳，确认没被蜘蛛网、树叶遮挡"],"tips":["「白天好、晚上黑」几乎等于供电或红外问题——别在网络上浪费时间。","画面问题先看线再看设备：换线、换电源能解决大部分画面异常。"],"escalate":"更换测试确认摄像头故障 → 换新；需要登高 → 两人配合再上。","script":"「我看下是摄像头的问题，还是录像机这边的问题，分开排查一下很快清楚。」"},{"id":"cv3","cat":"cctv","title":"NVR 搜不到 / 加不上摄像头","keywords":["NVR","搜不到","加不上","录像机","搜索设备","加通道","不出画面","搜不到摄像头","摄像头加不上","通道加不上","nvr搜不到"],"phenomenon":"新装或换线后，NVR 搜不到摄像头，或添加后不出画面。","quick":"三个「对」：网段对不对（摄像头和 NVR 同不同段）、协议对不对（私有协议 / ONVIF）、密码对不对。先扫网段，再谈其它。","causes":[{"t":"网段不对：NVR 和摄像头不在同一网段","p":"高"},{"t":"添加时协议选错（同品牌私有 / 混装 ONVIF）","p":"中"},{"t":"用户名密码不对，或摄像头被改过密码","p":"中"},{"t":"交换机 VLAN 隔离、网线问题","p":"低"}],"steps":["电脑用 SADP 扫描：确认摄像头在线，记下 IP 和网段","对比 NVR 的内网卡网段：不一致 → 改摄像头 IP 到 NVR 网段，或改 NVR 内网卡网段","手动添加通道：填对 IP、协议（同品牌选私有 / 自动，不同品牌选 ONVIF）、端口、账号密码","密码不对：海康新设备首次使用要先「激活」自己设密码；被改过 → 用原密码或 Reset 重来","添加成功但不出画面 → 删掉通道重新添加一遍；检查主 / 子码流设置","换交换机口、直连 NVR 测试，排除链路问题"],"tips":["不同品牌混装（海康头 + 大华 NVR）必须走 ONVIF，还要在摄像头里打开「ONVIF 功能」——最常见的加不上原因。","打电话问厂商技术支持时，直接报设备型号组合，效率最高。"],"escalate":"反复添加不成功 → 记录型号组合，联系厂商技术支持。","script":"「新设备接入要对齐三样：地址、协议、密码，我逐个核对一下。」"},{"id":"cv4","cat":"cctv","title":"PoE 摄像头不上电","keywords":["PoE","不上电","不供电","没电","摄像头无电","ping不通摄像头","摄像头不供电","口不供电","供电不足"],"phenomenon":"摄像头完全不亮（无灯），PoE 交换机口不供电或供电不正常。","quick":"三查：① 交换机是不是 PoE 款、这个口支不支持 PoE；② 摄像头功率超没超单口标准；③ 线是不是太长 / 太差（超 100 米或劣质线压降大）。","causes":[{"t":"交换机非 PoE，或该口不支持 / 被关闭","p":"高"},{"t":"网线超长（>100 米）或线质太差","p":"高"},{"t":"摄像头功率大于单口供电标准、整机总功率超了","p":"中"},{"t":"摄像头是非 PoE 型号（需要外接 12V 电源）","p":"低"},{"t":"PoE 口芯片坏","p":"低"}],"steps":["确认交换机：看型号和「PoE 总功率」标注；非 PoE 交换机 → 必须加 PoE 供电器或接电源","确认摄像头是 PoE 款（型号带 PoE 或看接口说明）——非 PoE 款必须接 12V 电源","换个已知能供电的 PoE 口测试 → 能上电 = 原口问题或功率分配问题","查线长线质：超过 100 米必须加中继 / 用光纤；用一根短网线直连测试——短线上电 = 线的问题","算功率：普通枪机 / 球机按 802.3af（15.4W）/ 802.3at（30W）算；多路摄像头总和接近交换机总功率时，后接的上不了电 → 错峰接或换大功率交换机","室外网口进水 / 氧化也会供电异常 → 重做水晶头并做防水"],"tips":["记两个数：网线有效距离 100 米；PoE 单口 af≈15.4W、at≈30W。","「短线能上电、长线不上电」= 线长或线质问题，不用怀疑设备。"],"escalate":"确认交换机口坏 → 换口或报修；工程需要加中继 / 换设备 → 报方案和材料。","script":"「我在判断是交换机供电的问题还是线的问题，短接测一下马上清楚。」"},{"id":"cv5","cat":"cctv","title":"画面卡顿 / 花屏 / 水波纹","keywords":["卡顿","花屏","水波纹","条纹","画面卡","模糊","雪花","马赛克","画面花","闪屏","画面糊"],"phenomenon":"画面不流畅、有横纹、波纹，偶尔马赛克。","quick":"一个通道卡 → 查那一路的线和电源；全部通道都卡 → 查 NVR 性能和交换机带宽；有规律横纹 / 水波 → 强电干扰或电源不干净。","causes":[{"t":"网线质量差 / 水晶头氧化，丢包导致卡顿","p":"高"},{"t":"电源不达标，或和强电捆在一起走线受干扰","p":"中"},{"t":"交换机带宽不够 / 级联层数太多","p":"中"},{"t":"码流设置过高、NVR 解码能力不足","p":"低"},{"t":"摄像头图像传感器老化","p":"低"}],"steps":["确认范围：一个头卡单独处理；全部卡 → 查交换机和 NVR","单通道：拿一根成品好网线明线测试 → 好了 = 原线路问题（重做水晶头 / 换线）","检查走线：网线和 220V 电源线有没有捆在一起平行走 → 分开走线","换干净的 12V 电源；PoE 供电不足也会花屏","全部卡：登录 NVR 检查码流，适当降低主码流；确认交换机是不是百兆带多路高清（多路 400 万以上建议千兆）","替换法确认：换头测试后仍花屏 → 摄像头老化，换一台验证"],"tips":["花屏 / 水波纹的排查顺序：线 → 电源 → 干扰 → 设备。前两项解决八成问题。","双绞线和强电分槽走线，这是施工规范，不是讲究。"],"escalate":"替换测试确认摄像头坏 → 报修 / 更换；需要重新布线 → 报方案。","script":"「画面问题一般是线或电源引起的，我用替换法测一下就能找到原因。」"},{"id":"of1","cat":"office","title":"IP 地址冲突","keywords":["IP冲突","地址冲突","冲突","一会通一会断","弹窗","网络冲突","弹窗冲突","地址被占用"],"phenomenon":"电脑弹窗「检测到 IP 地址冲突」，上网一会好一会断。","quick":"看这台电脑是不是手动设了固定 IP——冲突的另一台多半是有人随手设了同一个地址。最快解法：改成自动获取，或换一个没人用的 IP。","causes":[{"t":"两台设备手动设了同一个固定 IP","p":"高"},{"t":"固定 IP 落在路由器自动分配的范围里，撞上被分出去的地址","p":"中"},{"t":"设备故障乱发地址（少见）","p":"低"}],"steps":["看本机是自动获取还是固定 IP：ipconfig /all 里看 DHCP 是否启用","固定 IP 的：先改成自动获取测试；确需固定 → 换规划外的地址并登记台账","自动获取的：cmd 里 ipconfig /release 再 ipconfig /renew 重新拿地址","找冲突源：路由器 DHCP 客户端列表里看该 IP，或交换机上看该 IP 对应几个 MAC，对照设备清单找到那台","补台账：哪些 IP 留给固定设备、哪段给自动分配，写清楚，从根上防冲突"],"tips":["冲突的根因九成是「有人随手设了个固定 IP」。","解决靠台账规划，不靠反复重启。"],"escalate":"找不到冲突源、反复冲突 → 用扫描工具（如 Advanced IP Scanner）扫全网段，重新规划 IP。","script":"「是两台设备用了同一个地址，我帮您把地址理顺，以后就不会再冲了。」"},{"id":"of2","cat":"office","title":"打印机脱机 / 打不出来","keywords":["打印机","打不出来","脱机","打印不了","连不上打印机","卡纸","打印机没反应","打印机离线","打着没反应"],"phenomenon":"点了打印没反应，打印机显示「脱机」。","quick":"先看打印机屏幕 / 灯有没有报错（缺纸、卡纸、缺墨），再把打印队列「取消所有文档」重打——一半问题到这就解决了。","causes":[{"t":"打印队列卡了旧任务","p":"高"},{"t":"打印机网络 / 线缆断开（IP 变了、USB 松了）","p":"高"},{"t":"驱动异常 / 端口选错","p":"中"},{"t":"缺纸、卡纸、耗材用尽","p":"低"}],"steps":["看打印机本体：电源灯、屏幕报错（缺纸 / 卡纸 / 墨粉）","清队列：设备和打印机 → 右键打印机 → 查看打印队列 → 取消所有文档","网络打印机：在打印机屏幕上查 IP → 电脑 ping 通不通；不通 → 打印机网络掉了（重启打印机、查网线）","USB 打印机：换 USB 口、换线；换一台电脑测","查端口：打印机属性 → 端口 → 确认指向正确 IP / 端口（打印机改过 IP 的要同步更新）","重装驱动：去官网按型号下载，别用万能驱动"],"tips":["顺序：先清队列 → 再看连通 → 最后查驱动。顺序对了省一半时间。","网络打印机建议在路由器里给它固定 IP，避免「换了 IP 就脱机」。"],"escalate":"硬件报错（卡纸取不出、故障码）→ 联系打印机售后。","script":"「我先清一下打印任务，看是不是队列堵了，再检查连接，很快。」"},{"id":"of3","cat":"office","title":"电脑开机无显示 / 开不了机","keywords":["开不了机","开机无显示","黑屏","点不亮","主机","启动不了","按电源没反应","开机黑屏","主机开不了","开不了"],"phenomenon":"按电源键没反应，或风扇转但屏幕没画面。","quick":"先判断「有没有电」：主机灯亮不亮、风扇转不转。不转 = 供电问题（插座、电源线、电源开关）；转但无显示 = 显示信号问题（视频线、信号源、内存条）。","causes":[{"t":"插座 / 排插没电、电源线松、主机电源开关没开","p":"高"},{"t":"视频线松 / 显示器没切对信号源","p":"中"},{"t":"内存条松动 / 氧化（台式机经典问题）","p":"中"},{"t":"显卡 / 主板 / 电源硬件故障","p":"低"}],"steps":["看主机电源灯和风扇：完全不转 → 换插座（拿别的小电器试）、电源线两端重插、主机背面电源开关确认在「-」位","风扇转但屏幕黑 → 看显示器电源灯（橙色 = 无信号）：视频线两端重插、手动切换显示器信号源","换一根视频线 / 换一台显示器测，排除线和显示器","台式机：断电后开侧盖，把内存条拔下、橡皮擦金手指后重插（先征得机主同意）","接独显的：把线插到主板集显口测一次，判断是不是显卡问题","有无报警声？记下几声蜂鸣，不同主板含义不同，报修时说明"],"tips":["口诀：先电源后信号，先外部后内部。","内存条重插是老技术员的肌肉记忆——十台开不了机的台式机，能救回来三台。"],"escalate":"替换测试确认主板 / 电源 / 显卡故障 → 报修或建议更换；客户机器先征求同意再拆，数据安全放在第一位。","script":"「我先做基础检查：电源、线、显示器，这几步能排除大多数'不开机'。」"},{"id":"of4","cat":"office","title":"共享文件夹 / 网上邻居访问不了","keywords":["共享","共享文件夹","网上邻居","访问共享","无权限","网络路径","共享打不开","访问不了共享","工作组"],"phenomenon":"访问共享文件夹提示无权限 / 找不到网络路径 / 要账号密码。","quick":"先看「共享那台电脑能不能被 ping 通」：不通 → 先当网络问题处理；通 → 当权限问题处理。用 IP 直访（\\\\192.168.1.x）通常能绕过名称解析的坑。","causes":[{"t":"名称解析问题：看不到「计算机名」，但用 IP 能访问","p":"高"},{"t":"权限问题：共享权限 / 安全权限 / 账号密码","p":"高"},{"t":"对方电脑防火墙拦了文件共享、来宾访问被禁","p":"中"},{"t":"对方电脑没开机 / 共享没开","p":"低"}],"steps":["先 ping 对方电脑 IP：不通 → 按网络问题处理；通 → 继续","资源管理器地址栏输入 \\\\对方IP —— 能打开 = 名称解析问题（直接用 IP；可写 hosts 固化）","提示要账号密码 → 输对方电脑的账号；或配「所有人可访问」的共享","权限检查：对方电脑右键文件夹 → 属性 → 共享 → 添加 Everyone 读写；再看「安全」标签页给权限","检查对方电脑：防火墙「文件和打印机共享」放行、网络发现打开；Win10/11 默认禁用来宾，用账号方式","重启两台电脑的 Workstation / Server 服务"],"tips":["万能第一招：\\\\IP 直访——一步区分「网络问题」还是「权限问题」。","共享修好后，让对方给这个文件夹配个专门账号，比 Everyone 更稳妥。"],"escalate":"涉及公司域环境、权限策略 → 找 IT 管理员，不改域内策略。","script":"「我先用 IP 直接访问试试，马上能分清是网络还是权限的问题。」","cmds":[{"t":"先确认到对方电脑网络通不通（IP 换成实际的）","c":"ping 192.168.1.100"},{"t":"资源管理器地址栏直访（IP 换成实际的）","c":"\\\\192.168.1.100"}]},{"id":"em1","cat":"emergency","title":"停电 / 关机后的恢复顺序","keywords":["断电","停电","恢复","重启顺序","来电","关机顺序","全网恢复","没电了","跳闸","来电了","恢复供电"],"phenomenon":"停电恢复后、或维护关机后，需要按顺序把设备恢复起来。","quick":"顺序口诀：光猫 → 路由 → 交换机 → NVR / 服务器 → 终端。每级上电后等指示灯稳定（1-2 分钟）再开下一级——上级就绪了，下级才能顺利拿到地址。","steps":["确认总电 / 排插已通电（看排插指示灯）","开光猫：等 PWR 常亮、PON 常亮（约 2-3 分钟）","开主路由器：等指示灯稳定、手机能连上（1-2 分钟）","开主交换机：看各口灯进入正常闪烁","开 NVR / 服务器：跟显示器确认画面 / 服务正常","开电脑和终端设备，逐台验证上网","整体抽查：打开几个网页、看监控画面、验证业务系统（收银 / 办公系统等）"],"tips":["关机顺序反过来：终端 → NVR → 交换机 → 路由 → 光猫。","长期不用的设备别骤停骤起；来电瞬间电压不稳，重要设备建议用带保护的排插。"],"escalate":"恢复后个别设备仍异常 → 单独排查那一台，不要反复整体重启。","script":"「来电 / 维护后我按顺序恢复设备，十分钟内全部检查一遍。」"},{"id":"em2","cat":"emergency","title":"机房 / 弱电间巡检「5 看」","keywords":["巡检","机房","弱电间","日常检查","定期检查","检查机房","看看机房","机柜检查"],"phenomenon":"日常巡检，或客户说「你去机房看看」时用。","quick":"五句话：看灯、听声、闻味、摸温、查线。走一圈三分钟，能提前   return { done:d, total:t, pct: t?Math.round(d/t*100):0 };
}
function updProg(id){
  var p = progOf(id);
  var el = document.getElementById('chkProg');
  if(el) el.innerHTML = p.done + ' <i>/ ' + p.total + '</i>';
  var bar = document.getElementById('chkBar');
  if(bar) bar.style.width = p.pct + '%';
  var bar2 = document.getElementById('sideBar');
  if(bar2) bar2.style.width = p.pct + '%';
  var big = document.getElementById('sideNum');
  if(big) big.innerHTML = p.done + '<i>/' + p.total + '</i>';
  var st = document.getElementById('sideSt');
  if(st) st.textContent = p.done===p.total && p.total ? '已全部完成' : (p.total-p.done) + ' 步待完成';
  $$('#sideToc li').forEach(function(li){
    var i = +li.getAttribute('data-i'), c = getChks(id);
    if(c[i]) li.classList.add('done'); else li.classList.remove('done');
  });
}

/* ===================== 搜索 ===================== */
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,''); }
function searchScenes(qRaw){
  var q = norm(qRaw); if(!q) return [];
  var bigrams=[]; for(var i=0;i<q.length-1;i++) bigrams.push(q.slice(i,i+2));
  var out = (KB.scenes||[]).map(function(s){
    var score=0, nTitle=norm(s.title);
    if(nTitle.indexOf(q)>=0) score+=6;
    (s.keywords||[]).forEach(function(k){ var nk=norm(k); if(q.indexOf(nk)>=0) score+=4; else if(q.length>=2 && nk.indexOf(q)>=0) score+=3; });
    var body = norm([s.phenomenon,s.quick].concat(s.steps||[],(s.causes||[]).map(function(c){return c.t;}),s.tips||[]).join(' '));
    if(q.length>=2 && body.indexOf(q)>=0) score+=2;
    if(score===0){
      var hits=0, seen={};
      bigrams.forEach(function(b){ if(!seen[b] && (nTitle.indexOf(b)>=0 || (s.keywords||[]).some(function(k){return norm(k).indexOf(b)>=0;}) || body.indexOf(b)>=0)){ seen[b]=1; hits++; } });
      score += Math.min(hits,4);
    }
    return {s:s, score:score};
  }).filter(function(r){return r.score>0;}).sort(function(a,b){ return b.score-a.score; });
  out = out.filter(function(r){ return r.score>=2; });
  return out;
}

var AI_SYS = '你是网络、弱电、办公设备方向的现场排障助手，服务对象是现场工程师。收到故障描述后：1）先用一句话确认现象与范围（是一台设备还是全部、有线还是无线）；2）按「物理层→网络层→设备层」给出最多 6 步排查步骤，每步带明确判断标准（看到什么说明什么、下一步做什么）；3）列出可能原因，按概率从高到低排序；4）指出哪些情况必须上报或找专业人员（强电、光纤、高空、客户核心设备）。语言简洁口语化、可直接照做，不使用空泛建议。';
var AI_TURNS = 6;                 /* 最多带最近 6 轮进上下文，防止越聊越贵 */
var AI_CHIPS = [
  '只有一部分设备有问题，其他都正常，怎么快速缩小范围？',

function aiReset(sceneId){
  if(state.ai.sceneId !== sceneId){ state.ai.sceneId = sceneId; state.ai.msgs = []; state.ai.refs = []; state.ai.err = null; }
}
function aiPick(q, sceneId){
  var list = searchScenes(q).slice(0,3).map(function(r){ return r.s; });
  if(sceneId){
    var cur = sceneById(sceneId);
    if(cur && list.indexOf(cur)<0) list.unshift(cur);
    list = list.slice(0,3);
  }
  if(!list.length && sceneId){ var c0 = sceneById(sceneId); if(c0) list = [c0]; }
  return list;
}
function aiCtx(list){
  return list.map(function(s){
    return '【'+s.title+'】原因：'+(s.causes||[]).map(function(c){ return c.t; }).join('；')+
           ' 步骤：'+(s.steps||[]).join('；');
  }).join('\n');
}
function aiPayload(){
  var hist = state.ai.msgs.slice(-AI_TURNS*2);
  var s = sceneById(state.ai.sceneId);
  return [
    { role:'system', content: AI_SYS },
    { role:'user', content:'【知识库参考资料】\n'+aiCtx(state.ai.refs)+
      '\n\n（以上是参考资料，回答以它为准。下面的提问都围绕「'+(s?s.title:'')+'」这个场景，可以接着上文追问。）' }
  ].concat(hist);
}
function aiMsgOf(d){
  return d && d.choices && d.choices[0] && d.choices[0].message ? (d.choices[0].message.content||'') : '';
}

/* ---------- 请求：优先流式，失败自动退回一次性 ---------- */
function aiRun(){
  var cfg = state.aiCfg, ctrl = null;
  try{ ctrl = new AbortController(); }catch(e){}
  state.ai.abort = ctrl;
  var body = { model:cfg.model, temperature:0.3, messages:aiPayload() };
  var opt = { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
              body: JSON.stringify(body), signal: ctrl?ctrl.signal:undefined };

  if(!state.ai.streamOK){ body.stream = false; opt.body = JSON.stringify(body); return aiOnce(opt); }
  body.stream = true; opt.body = JSON.stringify(body);
  fetch(cfg.url, opt).then(function(res){
    if(!res.ok){
      return res.text().then(function(t){ aiDone({ ok:false, err:{ status:res.status, body:t } }); });
    }
    var ct = res.headers && res.headers.get ? (res.headers.get('content-type')||'') : '';
    if(res.body && res.body.getReader && /event-stream/i.test(ct)){ return aiReadStream(res); }
    /* 平台没给流式：退回一次性解析，并把流式开关关掉 */
    state.ai.streamOK = false;
    return res.json().then(function(d){
      aiDone({ ok:true, msg:{ role:'assistant', content: aiMsgOf(d) || '（模型没有返回内容）' } });
    });
  }).catch(function(e){
    if(e && (e.name==='AbortError' || /abort/i.test(e.message||''))){
      aiDone({ ok:true, msg:{ role:'assistant', content: (state.ai.pending&&state.ai.pending.content) || '（已停止）' } });
      return;
    }
    /* 只有 TypeError（浏览器拦跨域 / 断网）才归到「连不上」，
       其它异常归到「解析失败」，别把代码问题说成网络问题 */
    if(e && e.name==='TypeError'){
      state.ai.streamOK = false;
      aiDone({ ok:false, err:{ net:true, message:(e&&e.message)||'网络错误' } });
      return;
    }
    aiDone({ ok:false, err:{ other:true, message:(e&&e.message)||'未知错误' } });
  });
}
function aiOnce(opt){
  return fetch(state.aiCfg.url, opt).then(function(res){
    if(!res.ok) return res.text().then(function(t){ aiDone({ ok:false, err:{ status:res.status, body:t } }); });
    return res.json().then(function(d){
      aiDone({ ok:true, msg:{ role:'assistant', content: aiMsgOf(d) || '（模型没有返回内容）' } });
    });
  }).catch(function(e){
    if(e && e.name==='AbortError'){ aiDone({ ok:true, msg:{ role:'assistant', content:'（已停止）' } }); return; }
    if(e && e.name==='TypeError'){ aiDone({ ok:false, err:{ net:true, message:(e&&e.message)||'网络错误' } }); return; }
    aiDone({ ok:false, err:{ other:true, message:(e&&e.message)||'未知错误' } });
  });
}
function aiReadStream(res){
  var reader = res.body.getReader(), dec = new TextDecoder('utf-8'), buf = '', full = '';
  function pump(){
    return reader.read().then(function(r){
      if(r.done){
        aiDone({ ok:true, msg:{ role:'assistant', content: full || '（模型没有返回内容）' } });
        return;
      }
      buf += dec.decode(r.value, {stream:true});
      var lines = buf.split('\n'); buf = lines.pop();
      lines.forEach(function(l){
        l = l.trim();
        if(l.indexOf('data:')!==0) return;
        var p = l.slice(5).trim();
        if(p==='[DONE]') return;
        try{ full += aiMsgOf(JSON.parse(p)); }catch(e){}
      });
      if(state.ai.pending) state.ai.pending.content = full;
      aiPaint();
      return pump();
    });
  }
  return pump().catch(function(e){
    if(e && e.name==='AbortError'){ aiDone({ ok:true, msg:{ role:'assistant', content: full || '（已停止）' } }); return; }
    aiDone({ ok:false, err:{ net:true, message:(e&&e.message)||'网络错误' } });
  });
}
function aiDone(res){
  if(!state.ai.busy) return;            /* 流式和非流式两条链都可能落在这里，只认第一次 */
  state.ai.busy = false;
  state.ai.abort = null;
  if(res.ok && res.msg){
    state.ai.msgs.push(res.msg);
    state.ai.pending = null;
  }else if(res.ok){
    state.ai.pending = null;
  }else{
    state.ai.pending = null;
    state.ai.err = res.err;
  }
  render();
  aiScroll();
}
function aiStop(){
  /* 用户主动停止：先把界面收尾，再去中止底层请求。
     不依赖 abort 一定能触发 read 抛错，否则界面会一直卡在「思考中」。 */
  var got = (state.ai.pending && state.ai.pending.content) || '';
  if(state.ai.abort){ try{ state.ai.abort.abort(); }catch(e){} }
  state.ai.abort = null;
  aiDone({ ok:true, msg:{ role:'assistant', content: got ? got+'\n\n（已停止生成）' : '（已停止）' } });
}

        '③ 离线部分不受影响，搜索、步骤、打印照常用。</div>';
  }else if(e.other){
    h = '<div class="t">收到回复但解析失败</div>'+
        '<div>这个平台返回的内容不是预期的格式，换一个平台（DeepSeek、硅基流动）通常就好了。</div>'+
        '<div class="fix">技术细节：'+esc(String(e.message||'').slice(0,120))+'</div>';
  }else{
    var s = e.status, t = '', fix = '';
    if(s===401||s===403){ t='Key 无效或没权限（HTTP '+s+'）'; fix='检查 API Key 是否复制完整、是否已过期或被停用。'; }
    else if(s===404){ t='接口地址或模型名不对（HTTP 404）'; fix='地址要填完整的 chat/completions；模型名要和平台上的写法完全一致。'; }
    else if(s===429){ t='请求太频繁（HTTP 429）'; fix='等十几秒再试，或降低调用频率。'; }
    else if(s===402){ t='余额不足（HTTP 402）'; fix='去平台充值后再试。'; }
    else if(s>=500){ t='平台那边出问题了（HTTP '+s+'）'; fix='过一会儿再试，或换个平台。'; }
    else{ t='请求失败（HTTP '+s+'）'; fix=(e.body||'').slice(0,160); }
    h = '<div class="t">'+esc(t)+'</div><div class="fix">'+esc(fix)+'</div>';
  }
  return '<div class="aibs">'+h+'<button class="btn ghost" data-act="ai-retry">'+ico('reset','s')+'重试</button>'+
         '<button class="btn bare" data-act="ai-stop">停止</button></div>';
}

function md2html(t){
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/^#{1,4}\s?(.+)$/gm,'<b>$1</b>')
    .replace(/^[-•*]\s?/gm,'• ')
    .replace(/\n/g,'<br>');
}

function buildCopyText(s){
  var chks = getChks(s.id), steps = s.steps||[];
  var L = ['【'+s.title+'】','分类：'+catOf(s.cat).name,'现象：'+s.phenomenon,'快速判断：'+s.quick];
  if((s.causes||[]).length) L.push('可能原因（按概率）：'+s.causes.map(function(c){ return c.t+'（'+c.p+'）'; }).join('；'));
  L.push('排查步骤：');
  steps.forEach(function(t,i){ L.push((chks[i]?'☑':'☐')+(i+1)+'. '+t); });
  if((s.tips||[]).length) L.push('提示：'+s.tips.join('；'));
  if((s.cmds||[]).length) L.push('常用命令：'+s.cmds.map(function(x){ return x.t+'：'+x.c; }).join('；'));
  if((s.tels||[]).length) L.push('电话：'+s.tels.map(function(x){ return x.t+x.n; }).join(' / '));
  if(s.escalate) L.push('上报：'+s.escalate);
  if(s.script) L.push('话术：'+s.script);
  L.push('—— '+KB.meta.title+' · 知识库 v'+KB.meta.version);
  return L.join('\n');
}
function copyText(t, msg){
  var m = msg||'已复制排查结果';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast(m); }, function(){ fallbackCopy(t, m); });
  }else{ fallbackCopy(t, m); }
}
function fallbackCopy(t, msg){
  var m = msg||'已复制排查结果';
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(m); }catch(e){ toast('复制失败，请长按选择文本'); }
  if(ta.remove) ta.remove();
}
function doPrint(){ try{ window.print(); }catch(e){ toast('当前环境不支持打印，可长按选择文字'); } }
var toastTimer=null;
function toast(msg){
  var el=$('#toast'); if(!el) return;
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove('on'); },1900);
}

/* ===================== 导航 ===================== */
function scrollTop(){ try{ window.scrollTo(0,0); }catch(e){} }
function showScene(id){ state.scene=id; state.view='scene'; state.q=''; state.cursor=-1; render(); scrollTop(); }
function showHome(){ state.view='home'; state.scene=null; state.cursor=-1; render(); try{ window.scrollTo(0, state.savingScroll||0); }catch(e){} }
function openScene(id){
  if(!sceneById(id)) return;
  state.savingScroll = (window.scrollY||0);
  pushRecent(id);
  showScene(id);
  try{ history.pushState({s:id}, '', '#s='+id); }catch(e){}
}
function inAppBack(){ if(history.state && history.state.s){ try{ history.back(); return; }catch(e){} } showHome(); }
window.addEventListener('popstate', function(ev){
  var st = ev.state;
  if(st && st.s && sceneById(st.s)){ state.scene=st.s; state.view='scene'; state.q=''; render(); scrollTop(); }
  else { showHome(); }
});

/* ===================== 事件 ===================== */
document.addEventListener('click', function(ev){
  var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!t) return;
  var act = t.getAttribute('data-act');
  /* Cmd/Ctrl/Shift/中键 = 让浏览器自己开新标签打开深链接，不拦截 */
  if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey||ev.button) return;
  /* 卡片是 <a href="#s=id">：必须阻止默认的片段跳转，否则会在 pushState 之外
     再造一条历史记录，返回键会把用户弹回首页。 */
  if((t.tagName||'').toLowerCase()==='a') ev.preventDefault();
  if(act==='open'){
    openScene(t.getAttribute('data-id'));
  }else if(act==='home'){
    state.cat='all'; state.q=''; if(state.view==='scene'){ inAppBack(); } else { state.cursor=-1; render(); scrollTop(); }
  }else if(act==='crumb'){
    state.cat = t.getAttribute('data-cat') || 'all'; state.q=''; inAppBack();
  }else if(act==='back'){
    inAppBack();
  }else if(act==='tab'){
    state.cat = t.getAttribute('data-cat'); state.q=''; state.cursor=-1;
    if(state.view==='scene'){ inAppBack(); } else { render(); scrollTop(); }
  }else if(act==='chip'){
    state.q = t.getAttribute('data-q'); state.cursor=-1; render(); focusSearch(); scrollTop();
  }else if(act==='clear-q'){
    state.q=''; state.cursor=-1; render(); focusSearch();
  }else if(act==='chk'){
    var cid=t.getAttribute('data-id'), i=+t.getAttribute('data-i');
    var done = !t.classList.contains('done');
    applyChk(t, done);
    setChk(cid, i, done);
    updProg(cid);
  }else if(act==='reset-chk'){
    var rid = t.getAttribute('data-id'), rs = sceneById(rid);
    if(rs){ (rs.steps||[]).forEach(function(_,i){ setChk(rid,i,false); }); }
    render(); toast('已重置勾选');
  }else if(act==='copy'){
    var s3 = sceneById(t.getAttribute('data-id'));
    if(s3) copyText(buildCopyText(s3));
  }else if(act==='copy-cmd'){
    ev.preventDefault();
    copyText(t.getAttribute('data-c'), '已复制命令');
  }else if(act==='fav'){
    ev.preventDefault();
    var fid = t.getAttribute('data-id'), added = toggleFav(fid);
    render(); toast(added?'已加入收藏':'已取消收藏');
  }else if(act==='print'){
    doPrint();
  }else if(act==='goto'){
    var el = document.getElementById('stp-'+t.getAttribute('data-i'));
    if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'center'});
  }else if(act==='settings'){
    state.showSettings = true; render();
  }else if(act==='close-settings'){
    if(ev.target.closest && ev.target.closest('[data-stop]') && !t.classList.contains('xbtn')) return;
    state.showSettings=false; render();
  }else if(act==='preset'){
    var p = PRESETS[+t.getAttribute('data-i')];
    var uEl=document.getElementById('cfgUrl'), mEl=document.getElementById('cfgModel');
    if(p.url && uEl && mEl){ uEl.value=p.url; mEl.value=p.model; }
    if(uEl) uEl.focus();
  }else if(act==='test-ai'){
    testAI();
  }else if(act==='ai-send'){
    askAI(t.getAttribute('data-id'), null);
  }else if(act==='ai-chip'){
    askAI(t.getAttribute('data-id'), t.getAttribute('data-q'));
  }else if(act==='ai-stop'){
    aiStop();
  }else if(act==='ai-retry'){
    var rq = state.ai.lastQ;
    if(rq) askAI(state.ai.sceneId, rq);
  }else if(act==='ai-clear'){
    state.ai.msgs = []; state.ai.refs = []; state.ai.err = null; state.ai.lastQ = '';
    render(); toast('已清空对话');
  }else if(act==='save-ai'){
    var url=gv('cfgUrl'), model=gv('cfgModel'), key=gv('cfgKey');
    if(url && (!model || !key)){ toast('地址、模型、Key 都要填'); return; }
    saveAI({url:url, model:model, key:key}); state.showSettings=false; render(); toast(url?'AI 已开启':'已保存');
  }else if(act==='clear-ai'){
    saveAI({}); state.showSettings=false; render(); toast('已清除 AI 设置');
  }
});
function applyChk(el, done){
  el.classList.toggle('done', done);
  el.setAttribute('aria-checked', done?'true':'false');
}
document.addEventListener('keydown', function(ev){
  var t = ev.target, tag = ((t&&t.tagName)||'').toLowerCase();
  var typing = tag==='input' || tag==='textarea' || (t && t.isContentEditable);
  var k = ev.key;
  if(k==='Escape'){
    if(state.showSettings){ state.showSettings=false; render(); return; }
    if(typing){ try{ t.blur(); }catch(e){} return; }
    if(state.q){ state.q=''; render(); return; }
    if(state.view==='scene'){ inAppBack(); }
    return;
  }
  if(typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(k==='/'){ ev.preventDefault(); focusSearch(); return; }
  if(k==='p' || k==='P'){ if(state.view==='scene'){ ev.preventDefault(); doPrint(); } return; }
  if(state.view!=='home') return;
  if(k==='j'||k==='J'||k==='ArrowDown'){ ev.preventDefault(); moveCursor(1); return; }
  if(k==='k'||k==='K'||k==='ArrowUp'){ ev.preventDefault(); moveCursor(-1); return; }
  if(k==='Enter' && state.cursor>=0 && !(t && t.classList && (t.classList.contains('favbtn')||t.classList.contains('cmd')))){
    var cards = $$('#stage .card'), c = cards[state.cursor];
    if(c){ ev.preventDefault(); openScene(c.getAttribute('data-id')); }
  }
});
document.addEventListener('keydown', function(ev){
  var t = ev.target, tag = ((t&&t.tagName)||'').toLowerCase();
  if(tag!=='input' && tag!=='textarea' && ev.key===' ' && t && t.classList && t.classList.contains('step')){
    ev.preventDefault();
    t.classList.toggle('done');
    setChk(t.getAttribute('data-id'), +t.getAttribute('data-i'), t.classList.contains('done'));
    updProg(t.getAttribute('data-id'));
  }
  if(t && t.classList && t.classList.contains('favbtn') && (ev.key==='Enter'||ev.key===' ')){
    ev.preventDefault();
    var added = toggleFav(t.getAttribute('data-id'));
    render(); toast(added?'已加入收藏':'已取消收藏');
  }
  if(t && t.classList && t.classList.contains('cmd') && (ev.key==='Enter'||ev.key===' ')){
    ev.preventDefault();
    copyText(t.getAttribute('data-c'), '已复制命令');
  }
});
window.addEventListener('resize', function(){
  var el = document.getElementById('dispNow');
  if(el){ el.textContent = dispLabel(); }
});

function focusSearch(){
  var q = document.getElementById('q');
  if(q && q.focus){ try{ q.focus(); q.select && q.select(); }catch(e){} }
}
function moveCursor(d){
  var cards = $$('#stage .card');
  if(!cards.length) return;
  var i = state.cursor + d;
  if(i<0) i=0; if(i>cards.length-1) i=cards.length-1;
  state.cursor = i;
  cards.forEach(function(c,ix){ if(ix===i) c.classList.add('cur'); else c.classList.remove('cur'); });
  if(cards[i].scrollIntoView) cards[i].scrollIntoView({block:'nearest'});
}

function bind(){
  bindAI();
  var q = document.getElementById('q');
  if(!q) return;
  var timer=null;
  q.addEventListener('input', function(){
    state.q = q.value;
    var box=document.getElementById('sbox'); if(box) box.classList.toggle('has', !!q.value);
    state.cursor=-1;
    clearTimeout(timer); timer=setTimeout(function(){
      var st=document.getElementById('stage'); if(st) st.innerHTML=listHTML();
    },180);
  });
  q.addEventListener('keydown', function(ev){
    if(ev.key==='Enter'){
      ev.preventDefault();
      var st=document.getElementById('stage');
      if(st) st.innerHTML=listHTML();
      var first = $('#stage .card');
      if(first && searchScenes(state.q).length===1) openScene(first.getAttribute('data-id'));
      else try{ q.blur(); }catch(e){}
    }
  });
}
/* AI 输入框：桌面回车发送 / 手机保留换行，文本框随内容长高 */
function autoGrow(el){
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(180, Math.max(72, el.scrollHeight)) + 'px';
}
function bindAI(){
  var el = document.getElementById('aiq');
  if(!el) return;
  autoGrow(el);
  el.addEventListener('input', function(){ autoGrow(el); });
  el.addEventListener('keydown', function(ev){
    if(ev.key==='Enter' && !ev.shiftKey && isDesktop() && !ev.isComposing){
      ev.preventDefault();
      askAI(state.ai.sceneId, el.value);
    }
  });
}

/* ===================== 启动 ===================== */
(function(){
  var h = (location.hash||'').replace(/^#/,'');
  if(h.indexOf('s=')===0){
    var id = h.slice(2);
    if(sceneById(id)){ state.scene=id; state.view='scene'; }
  }else if(h.indexOf('q=')===0){
    var v=h.slice(2); try{ v=decodeURIComponent(v); }catch(e){}
    if(v) state.q=v;
  }else if(h.indexOf('c=')===0){
    var cid=h.slice(2);
    var ok=false; (KB.meta.categories||[]).forEach(function(c){ if(c.id===cid) ok=true; });
    if(ok) state.cat=cid;
  }
})();
render();
try{
  if(document.documentElement && document.documentElement.setAttribute){
    document.documentElement.setAttribute('data-layout', isDesktop()?'desktop':'phone');
  }
}catch(e){}
</script>
